name: DeployFlow - CI Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deployflow-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Test, Build and Push Docker Image

    runs-on: ubuntu-latest

    timeout-minutes: 25

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}

    steps:

      # STEP 1: Download source code.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # STEP 3: Install dependencies.
      - name: Install dependencies
        run: npm ci

      # STEP 4: Run automated tests.
      - name: Run automated tests
        run: npm test

      # STEP 5: Verify Docker.
      - name: Check Docker installation
        run: |
          docker --version
          docker info

      # STEP 6: Build Docker image.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg "GIT_SHA=$GITHUB_SHA" \
            --tag "deployflow-demo:$GITHUB_SHA" \
            .

      # STEP 7: Start test container.
      - name: Run Docker container
        run: |
          docker run \
            --detach \
            --name deployflow-ci \
            --publish 127.0.0.1:3000:3000 \
            "deployflow-demo:$GITHUB_SHA"

      # STEP 8: Verify container health.
      - name: Verify container health
        shell: bash
        run: |
          HEALTHY=false

          for attempt in $(seq 1 30); do

            echo "Health check attempt: $attempt"

            CONTAINER_RUNNING=$(docker inspect \
              --format '{{.State.Running}}' \
              deployflow-ci 2>/dev/null || echo "false")

            if [ "$CONTAINER_RUNNING" != "true" ]; then
              echo "ERROR: Container is not running."
              docker ps -a
              docker logs deployflow-ci || true
              exit 1
            fi

            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 3 \
              --output health-response.json \
              http://127.0.0.1:3000/health; then

              if node -e '
                const fs = require("fs");

                const response = JSON.parse(
                  fs.readFileSync("health-response.json", "utf8")
                );

                if (
                  response.status !== "healthy" ||
                  response.commit !== process.env.GITHUB_SHA
                ) {
                  process.exit(1);
                }
              '; then

                HEALTHY=true
                echo "Application health verified."
                cat health-response.json
                break

              fi

            fi

            sleep 2

          done

          if [ "$HEALTHY" != "true" ]; then
            echo "ERROR: Application health check failed."
            docker ps -a
            docker logs deployflow-ci || true
            exit 1
          fi

          echo "Container health check passed."

      # STEP 9: Remove temporary test container.
      - name: Remove test container
        if: always()
        run: |
          docker rm -f deployflow-ci 2>/dev/null || true

      # STEP 10: Authenticate with AWS using OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "541293890816"

      # STEP 11: Verify AWS authentication.
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # STEP 12: Log in to Amazon ECR.
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # STEP 13: Check whether the image already exists.
      - name: Check existing image
        id: image-check
        shell: bash
        run: |
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA" \
            > image-description.json 2> image-error.txt; then

            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already exists in ECR."

          elif grep -q 'ImageNotFoundException' image-error.txt; then

            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist. Upload required."

          else

            echo "Unable to check ECR image."
            cat image-error.txt
            exit 1

          fi

      # STEP 14: Upload Docker image to ECR.
      - name: Push Docker image to ECR
        if: steps.image-check.outputs.exists == 'false'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        shell: bash
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"

          docker tag \
            "deployflow-demo:$GITHUB_SHA" \
            "$IMAGE_URI"

          docker push "$IMAGE_URI"

          echo "Uploaded image: $IMAGE_URI"

      # STEP 15: Verify uploaded image.
      - name: Verify ECR image
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$GITHUB_SHA"

      # STEP 16: Generate CI summary.
      - name: Generate CI summary
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          echo "## DeployFlow CI Pipeline" >> "$GITHUB_STEP_SUMMARY"

          echo "Automated tests: PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "Docker build: PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "Container health: PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "ECR image: VERIFIED" >> "$GITHUB_STEP_SUMMARY"

          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

          echo "Image: $ECR_REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA" \
            >> "$GITHUB_STEP_SUMMARY"
