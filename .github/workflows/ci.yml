name: DeployFlow - CI Pipeline

# Run automatically when code is pushed to main.
# Also allow manual execution.
on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Test and Build Application

    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:

      # STEP 1: Download source code.
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # STEP 2: Install Node.js.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # STEP 3: Install project dependencies.
      - name: Install dependencies
        run: npm ci

      # STEP 4: Run automated tests.
      - name: Run automated tests
        run: npm test

      # STEP 5: Verify Docker installation.
      - name: Check Docker installation
        run: |
          docker --version
          docker info

      # STEP 6: Build the Docker image.
      - name: Build Docker image
        run: |
          docker build \
            --build-arg "GIT_SHA=$GITHUB_SHA" \
            --tag "deployflow-demo:$GITHUB_SHA" \
            .

      # STEP 7: Start the Docker container.
      - name: Run Docker container
        run: |
          echo "Starting Docker container..."

          docker run \
            --detach \
            --name deployflow-ci \
            --publish 127.0.0.1:3000:3000 \
            "deployflow-demo:$GITHUB_SHA"

          echo "Container startup command completed."

      # STEP 8: Wait for application readiness.
      - name: Verify container health
        shell: bash
        run: |
          echo "Waiting for the application to become healthy..."

          HEALTHY=false

          for attempt in $(seq 1 30); do

            echo "Health check attempt: $attempt"

            # Verify that the container is still running.
            CONTAINER_RUNNING=$(docker inspect \
              --format '{{.State.Running}}' \
              deployflow-ci 2>/dev/null || echo "false")

            if [ "$CONTAINER_RUNNING" != "true" ]; then

              echo "ERROR: Docker container is not running."

              docker ps -a

              docker logs deployflow-ci || true

              exit 1

            fi

            # Attempt to access the application's health endpoint.
            if curl \
              --fail \
              --silent \
              --show-error \
              --max-time 3 \
              --output health-response.json \
              http://127.0.0.1:3000/health; then

              echo "Application responded."

              cat health-response.json

              # Validate health status and deployed commit.
              if node -e '
                const fs = require("fs");

                const response = JSON.parse(
                  fs.readFileSync(
                    "health-response.json",
                    "utf8"
                  )
                );

                if (
                  response.status !== "healthy" ||
                  response.commit !== process.env.GITHUB_SHA
                ) {
                  process.exit(1);
                }
              '; then

                echo "Application health verified."

                HEALTHY=true

                break

              fi

              echo "Health response did not match expected values."

            else

              echo "Application is not ready yet."

            fi

            sleep 2

          done

          # Fail if the application never became healthy.
          if [ "$HEALTHY" != "true" ]; then

            echo "ERROR: Application failed its health check."

            echo "Docker container status:"

            docker ps -a

            echo "Docker container details:"

            docker inspect deployflow-ci || true

            echo "Docker application logs:"

            docker logs deployflow-ci || true

            exit 1

          fi

          echo "Docker container health check passed."

      # STEP 9: Generate CI summary.
      - name: Generate CI summary
        run: |
          echo "## DeployFlow CI Pipeline" >> "$GITHUB_STEP_SUMMARY"

          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

          echo "Node.js: 22" >> "$GITHUB_STEP_SUMMARY"

          echo "Automated tests: PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "Docker build: PASSED" >> "$GITHUB_STEP_SUMMARY"

          echo "Container health: PASSED" >> "$GITHUB_STEP_SUMMARY"

      # STEP 10: Show application logs.
      - name: Display Docker logs
        if: always()
        run: |
          echo "Docker container logs:"

          docker logs deployflow-ci 2>/dev/null || true

      # STEP 11: Remove temporary Docker container.
      - name: Clean up Docker container
        if: always()
        run: |
          docker rm -f deployflow-ci 2>/dev/null || true

          echo "Temporary container cleanup completed."
