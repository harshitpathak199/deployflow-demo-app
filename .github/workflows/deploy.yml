name: DeployFlow - Deploy to EC2

# Deployment is triggered manually.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Full 40-character Git commit SHA of the Docker image"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

# Prevent concurrent deployments to the same EC2 instance.
concurrency:
  group: deployflow-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Image

    runs-on: ubuntu-latest

    timeout-minutes: 30

    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      IMAGE_TAG: ${{ inputs.image_tag }}

    steps:

      # STEP 1: Validate the selected image tag.
      - name: Validate Docker image tag
        shell: bash
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-f0-9]{40}$ ]]; then
            echo "ERROR: Enter a valid 40-character Git commit SHA."
            exit 1
          fi

          echo "Selected image: $IMAGE_TAG"

      # STEP 2: Authenticate with AWS using OIDC.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: "541293890816"

      # STEP 3: Verify AWS identity.
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # STEP 4: Check whether the selected image exists.
      - name: Verify Docker image exists in ECR
        run: |
          aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG"

          echo "Docker image found in ECR."

      # STEP 5: Start EC2 if required.
      - name: Start EC2 instance
        shell: bash
        run: |
          INSTANCE_STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)

          echo "Current EC2 state: $INSTANCE_STATE"

          case "$INSTANCE_STATE" in

            stopped)
              echo "Starting EC2 instance..."

              aws ec2 start-instances \
                --instance-ids "$INSTANCE_ID"
              ;;

            running|pending)
              echo "Instance is already running or starting."
              ;;

            *)
              echo "ERROR: Unsupported EC2 state: $INSTANCE_STATE"
              exit 1
              ;;

          esac

          aws ec2 wait instance-running \
            --instance-ids "$INSTANCE_ID"

          echo "EC2 instance is running."

      # STEP 6: Wait for Systems Manager.
      - name: Wait for Systems Manager
        shell: bash
        run: |
          SSM_READY=false

          for attempt in $(seq 1 60); do

            echo "Checking SSM availability: $attempt"

            SSM_STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)

            if [[ "$SSM_STATUS" == "Online" ]]; then
              SSM_READY=true
              echo "Systems Manager is online."
              break
            fi

            sleep 10

          done

          if [[ "$SSM_READY" != "true" ]]; then
            echo "ERROR: Systems Manager did not become available."
            exit 1
          fi

      # STEP 7: Execute the deployment script on EC2.
      - name: Execute Docker deployment
        id: remote-deploy
        shell: bash
        run: |
          echo "Preparing remote deployment..."

          printf \
            '{"commands":["sudo /opt/deployflow/deploy.sh %s"]}\n' \
            "$IMAGE_TAG" > ssm-parameters.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-parameters.json \
            --timeout-seconds 120 \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

          echo "Waiting for deployment execution..."

          DEPLOYMENT_COMPLETE=false

          for attempt in $(seq 1 90); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)

            echo "Deployment status: $STATUS"

            case "$STATUS" in

              Success)
                echo "Deployment command completed successfully."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text

                DEPLOYMENT_COMPLETE=true
                break
                ;;

              Failed|Cancelled|TimedOut)
                echo "ERROR: Deployment failed."

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardOutputContent' \
                  --output text || true

                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --query 'StandardErrorContent' \
                  --output text || true

                exit 1
                ;;

            esac

            sleep 10

          done

          if [[ "$DEPLOYMENT_COMPLETE" != "true" ]]; then
            echo "ERROR: Deployment verification timed out."
            exit 1
          fi

      # STEP 8: Display deployment information.
      - name: Generate deployment summary
        shell: bash
        run: |
          PUBLIC_IP=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].PublicIpAddress' \
            --output text)

          echo "## DeployFlow Deployment" >> "$GITHUB_STEP_SUMMARY"

          echo "Status: SUCCESS" >> "$GITHUB_STEP_SUMMARY"

          echo "Image: $IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"

          echo "Instance: $INSTANCE_ID" >> "$GITHUB_STEP_SUMMARY"

          echo "Application URL: http://$PUBLIC_IP" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "Deployment successful."
          echo "Application URL: http://$PUBLIC_IP"
